<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alphabet Cards</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <h1>Alphabet Cards</h1>

        <p>
            Learn the alphabet interactively
        </p>

    </header>



    <!-- =================================
         MAIN
    ================================== -->

    <main>


        <!-- =================================
             CARD
        ================================== -->

        <div class="card-container">

            <div
                id="card"
                class="card"
            >
                A
            </div>

        </div>



        <!-- =================================
             CARD NUMBER
        ================================== -->

        <div
            id="cardNumber"
            class="card-number"
        >
            Card 1 of 27
        </div>



        <!-- =================================
             LETTER PROGRESS
        ================================== -->

        <div
            id="counter"
            class="counter"
        >
            0 of 26 letters completed • 26 remaining
        </div>



        <!-- =================================
             PROGRESS BAR
        ================================== -->

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>



        <!-- =================================
             CONTROLS
        ================================== -->

        <div class="controls">

            <button id="prevBtn">
                ← Previous
            </button>


            <button id="randomBtn">
                🎲 Random
            </button>


            <button id="shuffleBtn">
                🔀 Shuffle
            </button>


            <button id="nextBtn">
                Next →
            </button>

        </div>



        <!-- =================================
             LOWERCASE
        ================================== -->

        <div class="options">

            <label>

                <input
                    type="checkbox"
                    id="caseToggle"
                >

                Show Lowercase

            </label>

        </div>



        <!-- =================================
             START OVER
        ================================== -->

        <button
            id="resetBtn"
            class="reset-button"
        >

            ↻ Start Over

        </button>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        A-Z Interactive Alphabet Cards

    </footer>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>


</body>

</html>
